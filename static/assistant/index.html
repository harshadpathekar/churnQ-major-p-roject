<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ChurnQ AI Chatbot — Ask questions about the AI-Assisted Customer Churn Prediction for Telecom Using Quantum Computing project.">
    <title>ChurnQ — Project Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
/* ========================================================================
   ChurnQ Chatbot — Antigravity-Inspired Black & White Theme
   Sleek, minimal, monochrome with subtle accent glows
   ======================================================================== */

/* ----- CSS Custom Properties ----- */
:root {
    --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

    --transition-fast: 0.15s ease;
    --transition-normal: 0.25s ease;
    --transition-slow: 0.4s ease;

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-xl: 24px;
    --radius-full: 9999px;

    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.15);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.2);
    --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.3);
    --shadow-glow: 0 0 20px rgba(255, 255, 255, 0.08);
}

/* ═══════════════════════════════════════════════════════
   DARK THEME — Antigravity-style pure black
   ═══════════════════════════════════════════════════════ */
[data-theme="dark"] {
    --bg-primary: #000000;
    --bg-secondary: #0a0a0a;
    --bg-tertiary: #141414;
    --bg-glass: rgba(10, 10, 10, 0.85);
    --bg-glass-hover: rgba(20, 20, 20, 0.9);
    --bg-input: #0e0e0e;
    --bg-bot-bubble: linear-gradient(135deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
    --bg-user-bubble: linear-gradient(135deg, #ffffff, #e0e0e0);
    --bg-chip: rgba(255, 255, 255, 0.06);
    --bg-chip-hover: rgba(255, 255, 255, 0.12);

    --text-primary: #f0f0f0;
    --text-secondary: #999999;
    --text-tertiary: #555555;
    --text-user-bubble: #000000;
    --text-bot-bubble: #d4d4d4;
    --text-chip: #b0b0b0;

    --border-primary: rgba(255, 255, 255, 0.08);
    --border-secondary: rgba(255, 255, 255, 0.04);
    --border-input: rgba(255, 255, 255, 0.1);
    --border-input-focus: rgba(255, 255, 255, 0.4);

    --accent-primary: #ffffff;
    --accent-secondary: #888888;
    --accent-gradient: linear-gradient(135deg, #ffffff, #999999);
    --accent-subtle: rgba(255, 255, 255, 0.1);

    --scrollbar-track: #0a0a0a;
    --scrollbar-thumb: #222222;
    --scrollbar-thumb-hover: #444444;

    --mic-active: #ff4444;
    --voice-ring: rgba(255, 255, 255, 0.15);
    --speaker-active: #4ade80;
}

/* ═══════════════════════════════════════════════════════
   LIGHT THEME — Clean white Antigravity style
   ═══════════════════════════════════════════════════════ */
[data-theme="light"] {
    --bg-primary: #f8f8f8;
    --bg-secondary: #ffffff;
    --bg-tertiary: #f0f0f0;
    --bg-glass: rgba(255, 255, 255, 0.9);
    --bg-glass-hover: rgba(255, 255, 255, 0.95);
    --bg-input: #ffffff;
    --bg-bot-bubble: linear-gradient(135deg, rgba(0, 0, 0, 0.03), rgba(0, 0, 0, 0.01));
    --bg-user-bubble: linear-gradient(135deg, #1a1a1a, #333333);
    --bg-chip: rgba(0, 0, 0, 0.04);
    --bg-chip-hover: rgba(0, 0, 0, 0.08);

    --text-primary: #111111;
    --text-secondary: #666666;
    --text-tertiary: #999999;
    --text-user-bubble: #ffffff;
    --text-bot-bubble: #333333;
    --text-chip: #555555;

    --border-primary: rgba(0, 0, 0, 0.08);
    --border-secondary: rgba(0, 0, 0, 0.04);
    --border-input: rgba(0, 0, 0, 0.12);
    --border-input-focus: rgba(0, 0, 0, 0.4);

    --accent-primary: #111111;
    --accent-secondary: #666666;
    --accent-gradient: linear-gradient(135deg, #1a1a1a, #555555);
    --accent-subtle: rgba(0, 0, 0, 0.06);

    --scrollbar-track: #f0f0f0;
    --scrollbar-thumb: #cccccc;
    --scrollbar-thumb-hover: #999999;

    --mic-active: #ef4444;
    --voice-ring: rgba(0, 0, 0, 0.1);
    --speaker-active: #22c55e;
}

/* ----- Reset & Base ----- */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

body {
    font-family: var(--font-primary);
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow: hidden;
    transition: background var(--transition-normal), color var(--transition-normal);
}

/* ----- Particles Canvas ----- */
#particlesCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: 0.3;
}

/* ----- App Container ----- */
.app-container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 860px;
    margin: 0 auto;
}

/* ----- Header ----- */
.chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: var(--bg-glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--border-secondary);
    flex-shrink: 0;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo-icon {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    animation: logoPulse 5s ease-in-out infinite;
}

@keyframes logoPulse {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.2)); }
    50% { filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.4)); }
}

[data-theme="light"] .logo-icon {
    animation: logoPulseLight 5s ease-in-out infinite;
}

@keyframes logoPulseLight {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.1)); }
    50% { filter: drop-shadow(0 0 12px rgba(0, 0, 0, 0.2)); }
}

.header-text h1 {
    font-size: 1.25rem;
    font-weight: 700;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.3;
}

.header-subtitle {
    font-size: 0.75rem;
    color: var(--text-tertiary);
    font-weight: 400;
    letter-spacing: 0.04em;
    text-transform: uppercase;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 6px;
}

.btn-icon {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-chip);
    border: 1px solid var(--border-primary);
    border-radius: var(--radius-md);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition-fast);
}

.btn-icon:hover {
    background: var(--bg-chip-hover);
    color: var(--text-primary);
    transform: scale(1.05);
    box-shadow: var(--shadow-glow);
}

/* Voice toggle active state */
.btn-icon.voice-active {
    color: var(--speaker-active);
    border-color: var(--speaker-active);
    background: rgba(74, 222, 128, 0.1);
}

/* Theme toggle icon visibility */
[data-theme="dark"] .icon-moon { display: none; }
[data-theme="dark"] .icon-sun { display: block; }
[data-theme="light"] .icon-sun { display: none; }
[data-theme="light"] .icon-moon { display: block; }

/* Voice toggle icon visibility */
.icon-voice-off { display: none; }
.icon-voice-on { display: block; }
.btn-icon.voice-active .icon-voice-on { display: block; }
.btn-icon:not(.voice-active) .icon-voice-off { display: none; }

/* ----- Chat Messages ----- */
.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 24px 8px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
}

.chat-messages::-webkit-scrollbar {
    width: 5px;
}
.chat-messages::-webkit-scrollbar-track {
    background: var(--scrollbar-track);
}
.chat-messages::-webkit-scrollbar-thumb {
    background: var(--scrollbar-thumb);
    border-radius: var(--radius-full);
}
.chat-messages::-webkit-scrollbar-thumb:hover {
    background: var(--scrollbar-thumb-hover);
}

/* ----- Message Bubbles ----- */
.message {
    display: flex;
    gap: 12px;
    max-width: 85%;
    animation: messageSlideIn 0.3s ease-out;
}

@keyframes messageSlideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.user {
    align-self: flex-end;
    flex-direction: row-reverse;
}

.message.bot {
    align-self: flex-start;
}

.message-avatar {
    width: 34px;
    height: 34px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
    letter-spacing: 0.05em;
}

.message.bot .message-avatar {
    background: var(--accent-gradient);
    color: var(--text-user-bubble);
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.08);
}

[data-theme="light"] .message.bot .message-avatar {
    box-shadow: 0 0 12px rgba(0, 0, 0, 0.06);
}

.message.user .message-avatar {
    background: var(--accent-subtle);
    color: var(--text-secondary);
    border: 1px solid var(--border-primary);
}

.message-content {
    padding: 14px 18px;
    border-radius: var(--radius-lg);
    line-height: 1.65;
    font-size: 0.925rem;
    position: relative;
}

.message.bot .message-content {
    background: var(--bg-bot-bubble);
    color: var(--text-bot-bubble);
    border: 1px solid var(--border-primary);
    border-bottom-left-radius: var(--radius-sm);
}

.message.user .message-content {
    background: var(--bg-user-bubble);
    color: var(--text-user-bubble);
    border-bottom-right-radius: var(--radius-sm);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
}

.message-content p { margin-bottom: 8px; }
.message-content p:last-child { margin-bottom: 0; }

.message-content strong {
    color: var(--text-primary);
    font-weight: 600;
}

.message.user .message-content strong {
    color: rgba(255, 255, 255, 0.9);
}

.message-content ul,
.message-content ol {
    margin: 8px 0;
    padding-left: 20px;
}

.message-content li { margin-bottom: 4px; }

.message-content code {
    font-family: var(--font-mono);
    font-size: 0.85em;
    background: var(--accent-subtle);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border-primary);
}

/* Speaker button on bot messages */
.msg-speak-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
    padding: 4px 10px;
    font-size: 0.7rem;
    font-family: var(--font-primary);
    color: var(--text-tertiary);
    background: var(--accent-subtle);
    border: 1px solid var(--border-primary);
    border-radius: var(--radius-full);
    cursor: pointer;
    transition: all var(--transition-fast);
}

.msg-speak-btn:hover {
    color: var(--text-primary);
    background: var(--bg-chip-hover);
}

.msg-speak-btn.speaking {
    color: var(--speaker-active);
    border-color: var(--speaker-active);
    background: rgba(74, 222, 128, 0.08);
}

.message-time {
    font-size: 0.68rem;
    color: var(--text-tertiary);
    margin-top: 6px;
    text-align: right;
    display: flex;
    align-items: center;
    gap: 8px;
}

.message.bot .message-time {
    text-align: left;
}

/* ----- Welcome Message ----- */
.welcome-message {
    text-align: center;
    padding: 40px 20px;
    animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}

.welcome-logo {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
}

.welcome-message h2 {
    font-size: 1.6rem;
    font-weight: 700;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
}

.welcome-message p {
    color: var(--text-secondary);
    font-size: 0.95rem;
    max-width: 460px;
    margin: 0 auto;
    line-height: 1.6;
}

.welcome-features {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 24px;
    flex-wrap: wrap;
}

.welcome-feature {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--accent-subtle);
    border: 1px solid var(--border-primary);
    border-radius: var(--radius-full);
    font-size: 0.8rem;
    color: var(--text-secondary);
}

.welcome-feature svg {
    width: 16px;
    height: 16px;
    opacity: 0.6;
}

/* ----- Typing Indicator ----- */
.typing-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 8px 0;
}

.typing-indicator span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-tertiary);
    animation: typingBounce 1.2s ease-in-out infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

@keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
    30% { transform: translateY(-6px); opacity: 0.8; }
}

/* ----- Suggestions Bar ----- */
.suggestions-bar {
    display: flex;
    gap: 8px;
    padding: 8px 24px 4px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
}

.suggestions-bar::-webkit-scrollbar { display: none; }

.suggestion-chip {
    flex-shrink: 0;
    padding: 8px 16px;
    font-size: 0.8rem;
    font-family: var(--font-primary);
    font-weight: 500;
    color: var(--text-chip);
    background: var(--bg-chip);
    border: 1px solid var(--border-primary);
    border-radius: var(--radius-full);
    cursor: pointer;
    transition: all var(--transition-fast);
    white-space: nowrap;
}

.suggestion-chip:hover {
    background: var(--bg-chip-hover);
    border-color: var(--text-tertiary);
    color: var(--text-primary);
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
}

.suggestion-chip:active { transform: translateY(0); }

/* ----- Input Area ----- */
.chat-input-area {
    padding: 12px 24px 16px;
    background: var(--bg-glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid var(--border-secondary);
    flex-shrink: 0;
}

.input-wrapper {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-input);
    border: 1.5px solid var(--border-input);
    border-radius: var(--radius-lg);
    padding: 4px 6px 4px 18px;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.input-wrapper:focus-within {
    border-color: var(--border-input-focus);
    box-shadow: 0 0 0 3px var(--accent-subtle), var(--shadow-glow);
}

#userInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: var(--font-primary);
    font-size: 0.95rem;
    color: var(--text-primary);
    padding: 12px 0;
}

#userInput::placeholder { color: var(--text-tertiary); }

.send-btn, .mic-btn {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all var(--transition-fast);
    flex-shrink: 0;
}

.send-btn {
    background: var(--accent-gradient);
    color: var(--text-user-bubble);
}

.send-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
}

.send-btn:active { transform: scale(0.95); }

.mic-btn {
    background: var(--accent-subtle);
    color: var(--text-secondary);
    border: 1px solid var(--border-primary);
}

.mic-btn:hover {
    color: var(--text-primary);
    background: var(--bg-chip-hover);
}

.mic-btn.recording {
    background: rgba(255, 68, 68, 0.15);
    color: var(--mic-active);
    border-color: var(--mic-active);
    animation: micPulse 1.5s ease-in-out infinite;
}

@keyframes micPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.3); }
    50% { box-shadow: 0 0 0 8px rgba(255, 68, 68, 0); }
}

.mic-icon-active { display: none; }
.mic-btn.recording .mic-icon-default { display: none; }
.mic-btn.recording .mic-icon-active { display: block; }

.input-hint {
    font-size: 0.7rem;
    color: var(--text-tertiary);
    text-align: center;
    margin-top: 8px;
    letter-spacing: 0.02em;
}

/* ----- Voice Overlay ----- */
.voice-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(20px);
    display: none;
    align-items: center;
    justify-content: center;
}

.voice-overlay.active {
    display: flex;
    animation: fadeIn 0.3s ease;
}

.voice-overlay-content {
    text-align: center;
}

.voice-rings {
    position: relative;
    width: 140px;
    height: 140px;
    margin: 0 auto 24px;
}

.voice-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--voice-ring);
    animation: ringPulse 2s ease-in-out infinite;
}

.ring-2 {
    inset: -15px;
    animation-delay: 0.3s;
    opacity: 0.6;
}

.ring-3 {
    inset: -30px;
    animation-delay: 0.6s;
    opacity: 0.3;
}

@keyframes ringPulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.1); opacity: 0.2; }
}

.voice-mic-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
}

.voice-status {
    color: #ffffff;
    font-size: 1.1rem;
    font-weight: 500;
    margin-bottom: 8px;
}

.voice-transcript {
    color: #999999;
    font-size: 0.9rem;
    min-height: 24px;
    font-style: italic;
}

.voice-cancel-btn {
    margin-top: 24px;
    padding: 10px 28px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: var(--radius-full);
    color: #ffffff;
    font-family: var(--font-primary);
    font-size: 0.85rem;
    cursor: pointer;
    transition: all var(--transition-fast);
}

.voice-cancel-btn:hover {
    background: rgba(255, 255, 255, 0.2);
}

/* ----- Responsive ----- */
@media (max-width: 640px) {
    .chat-header { padding: 12px 16px; }
    .header-text h1 { font-size: 1.05rem; }
    .header-subtitle { font-size: 0.65rem; }
    .chat-messages { padding: 16px 12px 8px 12px; }
    .message { max-width: 92%; }
    .suggestions-bar { padding: 8px 12px 4px; }
    .chat-input-area { padding: 10px 12px 14px; }
    .welcome-message h2 { font-size: 1.3rem; }
    .welcome-logo { width: 56px; height: 56px; }
    .welcome-features { gap: 8px; }
    .welcome-feature { padding: 6px 12px; font-size: 0.72rem; }
}

@media (max-width: 380px) {
    .logo-icon { width: 36px; height: 36px; }
    .message-avatar { width: 28px; height: 28px; font-size: 0.7rem; }
    .header-right { gap: 4px; }
    .btn-icon { width: 34px; height: 34px; }
}

</style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-left">
                <div class="logo-icon">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="18" stroke="url(#grad1)" stroke-width="2" fill="none"/>
                        <circle cx="20" cy="20" r="10" stroke="url(#grad2)" stroke-width="1.2" fill="none" opacity="0.5"/>
                        <circle cx="20" cy="12" r="3" fill="url(#grad1)"/>
                        <circle cx="13" cy="24" r="3" fill="url(#grad2)"/>
                        <circle cx="27" cy="24" r="3" fill="url(#grad1)"/>
                        <line x1="20" y1="12" x2="13" y2="24" stroke="url(#grad2)" stroke-width="1" opacity="0.4"/>
                        <line x1="20" y1="12" x2="27" y2="24" stroke="url(#grad1)" stroke-width="1" opacity="0.4"/>
                        <line x1="13" y1="24" x2="27" y2="24" stroke="url(#grad2)" stroke-width="1" opacity="0.4"/>
                        <defs>
                            <linearGradient id="grad1" x1="0" y1="0" x2="40" y2="40">
                                <stop offset="0%" stop-color="#ffffff"/>
                                <stop offset="100%" stop-color="#888888"/>

    }

        return THANKS_RESPONSE;

    if (BYE_KEYWORDS.some(b => msg.includes(b)) && msg.length < 30) {
        return BYE_RESPONSE;
    }

    let bestTopic = null;
    let bestScore = 0;

    for (const [topicKey, topic] of Object.entries(KNOWLEDGE_BASE)) {
        let score = 0;
        for (const keyword of topic.keywords) {
            if (msg.includes(keyword.toLowerCase())) {
                score += keyword.length;

        if (score > bestScore) {
            bestScore = score;
            bestTopic = topic;
        }
    }

    if (bestTopic && bestScore >= 3) {

    }

    // Fuzzy fallback

// ─── Voice Assistant — Text-to-Speech ────────────────────────────────────────
let voiceEnabled = true;
let currentUtterance = null;

function speakText(text) {
    if (!voiceEnabled || !('speechSynthesis' in window)) return;

    // Cancel any ongoing speech
    window.speechSynthesis.cancel();

    const plainText = stripHtml(text);
    const utterance = new SpeechSynthesisUtterance(plainText);
    utterance.rate = 1.0;
    utterance.pitch = 1.0;
    utterance.volume = 0.9;

    // Try to pick a good English voice
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v => v.name.includes('Google') && v.lang.startsWith('en')) ||
                      voices.find(v => v.lang.startsWith('en-US')) ||
                      voices.find(v => v.lang.startsWith('en'));
    if (preferred) utterance.voice = preferred;

    currentUtterance = utterance;
    window.speechSynthesis.speak(utterance);
    return utterance;
}

function stopSpeaking() {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
    }
}

// ─── Voice Assistant — Speech Recognition ────────────────────────────────────
let recognition = null;
let isListening = false;

function initSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return null;

    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = true;
    recognition.continuous = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = (event) => {
        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
                finalTranscript += transcript;
            } else {
                interimTranscript += transcript;
            }
        }

        const voiceTranscript = document.getElementById('voiceTranscript');
        if (voiceTranscript) {
            voiceTranscript.textContent = finalTranscript || interimTranscript || '';
        }

        if (finalTranscript) {
            stopListening();
            setTimeout(() => sendMessage(finalTranscript), 300);
        }
    };

    recognition.onerror = (event) => {
        console.warn('Speech recognition error:', event.error);
        const voiceStatus = document.getElementById('voiceStatus');
        if (event.error === 'no-speech') {
            if (voiceStatus) voiceStatus.textContent = 'No speech detected. Try again.';
            setTimeout(stopListening, 1500);
        } else if (event.error === 'not-allowed') {
            if (voiceStatus) voiceStatus.textContent = 'Microphone access denied.';
            setTimeout(stopListening, 2000);
        } else {
            stopListening();
        }
    };

    recognition.onend = () => {
        if (isListening) {
            stopListening();
        }
    };

    return recognition;
}

function startListening() {
    if (!recognition) {
        recognition = initSpeechRecognition();
    }
    if (!recognition) {
        alert('Speech Recognition is not supported in this browser. Please use Chrome or Edge.');
        return;
    }

    isListening = true;
    const overlay = document.getElementById('voiceOverlay');
    const voiceStatus = document.getElementById('voiceStatus');
    const voiceTranscript = document.getElementById('voiceTranscript');
    const micBtn = document.getElementById('micBtn');

    overlay.classList.add('active');
    micBtn.classList.add('recording');
    if (voiceStatus) voiceStatus.textContent = 'Listening...';
    if (voiceTranscript) voiceTranscript.textContent = '';

    try {
        recognition.start();
    } catch (e) {
        // Already started
        console.warn('Recognition already started');
    }
}

function stopListening() {
    isListening = false;
    const overlay = document.getElementById('voiceOverlay');
    const micBtn = document.getElementById('micBtn');

    overlay.classList.remove('active');
    micBtn.classList.remove('recording');

    try {
        recognition.stop();
    } catch (e) {
        // Already stopped
    }
}

const themeToggleBtn = document.getElementById('themeToggleBtn');
const suggestionsBar = document.getElementById('suggestionsBar');
const micBtn = document.getElementById('micBtn');
const voiceToggleBtn = document.getElementById('voiceToggleBtn');
const voiceCancelBtn = document.getElementById('voiceCancelBtn');

// ─── Create Message Bubble ──────────────────────────────────────────────────
function createMessage(content, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', sender);

    const avatar = document.createElement('div');
    avatar.classList.add('message-avatar');
    avatar.textContent = sender === 'bot' ? 'CQ' : 'You';

    const contentDiv = document.createElement('div');
    contentDiv.classList.add('message-content');
    contentDiv.innerHTML = content;

    // Add speak button for bot messages
    if (sender === 'bot') {
        const speakBtn = document.createElement('button');
        speakBtn.classList.add('msg-speak-btn');
        speakBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg> Listen`;
        speakBtn.addEventListener('click', () => {
            // Remove speaking class from all other buttons
            document.querySelectorAll('.msg-speak-btn.speaking').forEach(b => b.classList.remove('speaking'));
            
            if (speakBtn.classList.contains('speaking')) {
                stopSpeaking();
                speakBtn.classList.remove('speaking');
                speakBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg> Listen`;
            } else {
                speakBtn.classList.add('speaking');
                speakBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg> Stop`;
                const utterance = speakText(content);
                if (utterance) {
                    utterance.onend = () => {
                        speakBtn.classList.remove('speaking');
                        speakBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg> Listen`;
                    };
                }
            }
        });
        contentDiv.appendChild(speakBtn);
    }

    const timeDiv = document.createElement('div');
    timeDiv.classList.add('message-time');
    const now = new Date();
    timeDiv.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    contentDiv.appendChild(timeDiv);

    msgDiv.appendChild(avatar);
    msgDiv.appendChild(contentDiv);

    return msgDiv;
}

// ─── Typing Effect ──────────────────────────────────────────────────────────
function showTypingIndicator() {
    const typingDiv = document.createElement('div');
    typingDiv.classList.add('message', 'bot');
    typingDiv.id = 'typingIndicator';

    const avatar = document.createElement('div');
    avatar.classList.add('message-avatar');
    avatar.textContent = 'CQ';

    const contentDiv = document.createElement('div');
    contentDiv.classList.add('message-content');
    contentDiv.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;

    typingDiv.appendChild(avatar);
    typingDiv.appendChild(contentDiv);
    chatMessages.appendChild(typingDiv);
    scrollToBottom();
}

function removeTypingIndicator() {
    const indicator = document.getElementById('typingIndicator');
    if (indicator) indicator.remove();
}

// ─── Scroll to Bottom ───────────────────────────────────────────────────────
function scrollToBottom() {
    chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
}

// ─── Send Message ───────────────────────────────────────────────────────────
let isProcessing = false;

function sendMessage(text) {
    const msg = (text || userInput.value).trim();
    if (!msg || isProcessing) return;

    isProcessing = true;

    const welcome = chatMessages.querySelector('.welcome-message');
    if (welcome) welcome.remove();

    chatMessages.appendChild(createMessage(msg, 'user'));
    userInput.value = '';
    scrollToBottom();

    showTypingIndicator();

    const delay = 400 + Math.random() * 600;
    setTimeout(() => {
        removeTypingIndicator();
        const response = findBestMatch(msg);
        chatMessages.appendChild(createMessage(response, 'bot'));
        scrollToBottom();
        saveChatHistory();

        // Auto-speak the response if voice is enabled
        if (voiceEnabled) {
            speakText(response);
        }

        isProcessing = false;
    }, delay);
}

// ─── Event Listeners ────────────────────────────────────────────────────────
sendBtn.addEventListener('click', () => sendMessage());

userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

// Suggestion chips
suggestionsBar.addEventListener('click', (e) => {
    const chip = e.target.closest('.suggestion-chip');
    if (chip) {
        sendMessage(chip.dataset.question);
    }
});

// Clear chat
clearChatBtn.addEventListener('click', () => {
    stopSpeaking();
    localStorage.removeItem('churnq-chat-history');
    showWelcome();
});

// Theme toggle
themeToggleBtn.addEventListener('click', () => {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('churnq-theme', next);
});

// Mic button — start/stop voice input
micBtn.addEventListener('click', () => {
    if (isListening) {
        stopListening();
    } else {
        startListening();
    }
});

// Voice toggle — enable/disable auto-speak
voiceToggleBtn.addEventListener('click', () => {
    voiceEnabled = !voiceEnabled;
    voiceToggleBtn.classList.toggle('voice-active', voiceEnabled);
    if (!voiceEnabled) {
        stopSpeaking();
    }
    localStorage.setItem('churnq-voice', voiceEnabled ? 'on' : 'off');
});

// Voice overlay cancel
voiceCancelBtn.addEventListener('click', () => {
    stopListening();
});

// ─── Chat Persistence (LocalStorage) ────────────────────────────────────────
function saveChatHistory() {
    const messages = chatMessages.querySelectorAll('.message');
    const history = [];
    messages.forEach(msg => {
        const sender = msg.classList.contains('user') ? 'user' : 'bot';
        const content = msg.querySelector('.message-content');
        const clone = content.cloneNode(true);
        const time = clone.querySelector('.message-time');
        if (time) time.remove();
        const speakBtn = clone.querySelector('.msg-speak-btn');
        if (speakBtn) speakBtn.remove();
        history.push({ sender, html: clone.innerHTML });
    });
    localStorage.setItem('churnq-chat-history', JSON.stringify(history));
}

function loadChatHistory() {
    const data = localStorage.getItem('churnq-chat-history');
    if (data) {
        try {
            const history = JSON.parse(data);
            if (history.length > 0) {
                chatMessages.innerHTML = '';
                history.forEach(item => {
                    chatMessages.appendChild(createMessage(item.html, item.sender));
                });
                scrollToBottom();
                return true;
            }
        } catch (e) {
            localStorage.removeItem('churnq-chat-history');
        }
    }
    return false;
}

// ─── Particles Background ───────────────────────────────────────────────────
function initParticles() {
    const canvas = document.getElementById('particlesCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const PARTICLE_COUNT = 45;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    class Particle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 0.3;
            this.vy = (Math.random() - 0.5) * 0.3;
            this.radius = Math.random() * 1.5 + 0.5;
            this.opacity = Math.random() * 0.4 + 0.1;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
            if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }
        draw() {
            const theme = document.documentElement.getAttribute('data-theme');
            const color = theme === 'dark' ? '255, 255, 255' : '0, 0, 0';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${color}, ${this.opacity})`;
            ctx.fill();
        }
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new Particle());
    }

    function drawLines() {
        const theme = document.documentElement.getAttribute('data-theme');
        const color = theme === 'dark' ? '255, 255, 255' : '0, 0, 0';
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 140) {
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.strokeStyle = `rgba(${color}, ${0.06 * (1 - dist / 140)})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        drawLines();
        requestAnimationFrame(animate);
    }
    animate();
}

// ─── Initialize ─────────────────────────────────────────────────────────────
function init() {
    // Load saved theme
    const savedTheme = localStorage.getItem('churnq-theme');
    if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
    }

    // Load voice preference
    const savedVoice = localStorage.getItem('churnq-voice');
    voiceEnabled = savedVoice !== 'off';
    voiceToggleBtn.classList.toggle('voice-active', voiceEnabled);

    // Init speech recognition
    initSpeechRecognition();

    // Load voices (Chrome loads them async)
    if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    }

    // Load chat history or show welcome
    if (!loadChatHistory()) {
        showWelcome();
    }

    // Start particles
    initParticles();

    // Focus input
    userInput.focus();
}

init();

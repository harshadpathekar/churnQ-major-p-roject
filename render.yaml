services:
  - type: web
    name: churnq-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: APP_AUTH_REQUIRED
        value: "true"
      - key: APP_USERNAME
        value: churnq
      - key: APP_PASSWORD
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: FLASK_SECRET_KEY
        generateValue: true